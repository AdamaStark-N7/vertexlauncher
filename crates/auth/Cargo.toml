[package]
name = "auth"
version.workspace = true
edition = "2024"

[dependencies]
logged_fs.workspace = true
log_redaction.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
image.workspace = true
base64.workspace = true
ureq.workspace = true
tracing.workspace = true
vertex_constants.workspace = true
zeroize = "1.8"
rand = "=0.8.5"
sha2 = "0.10"
url.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }
